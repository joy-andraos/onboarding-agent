<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>oboarding-agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<style>
  :root {
    --bg: #10141a;
    --panel: #161c24;
    --line: #262f3a;
    --fg: #e7e4dc;
    --fg-dim: #8b95a1;
    --accent: #7fe6a8;
    --accent-dim: #4f9c6d;
    --error: #e88a7d;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }

  .wrap { width: 100%; max-width: 720px; }

  header { margin-bottom: 32px; }

  .brand {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--accent-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  h1 .cursor {
    display: inline-block;
    width: 10px;
    height: 24px;
    background: var(--accent);
    margin-left: 6px;
    animation: blink 1.1s step-end infinite;
    vertical-align: -4px;
  }

  @keyframes blink { 50% { opacity: 0; } }

  p.sub {
    color: var(--fg-dim);
    font-size: 14.5px;
    line-height: 1.5;
    margin: 0;
    max-width: 54ch;
  }

  .prompt-bar {
    margin-top: 28px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding: 4px 4px 4px 16px;
    font-family: var(--mono);
    font-size: 14.5px;
    transition: border-color 0.15s ease;
  }

  .prompt-bar:focus-within { border-color: var(--accent-dim); }

  .prompt-sigil { color: var(--accent); margin-right: 10px; user-select: none; }

  .prompt-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font-family: var(--mono);
    font-size: 14.5px;
    padding: 12px 0;
  }

  .prompt-bar input::placeholder { color: #4d5763; }

  .run-btn {
    background: var(--accent);
    color: #0d1310;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .run-btn:hover { opacity: 0.85; }
  .run-btn:disabled { opacity: 0.4; cursor: default; }

  .log {
    margin-top: 18px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--fg-dim);
    min-height: 20px;
    line-height: 1.9;
  }

  .log .line { opacity: 0; animation: fadein 0.3s ease forwards; }
  .log .line.done::before { content: "✓ "; color: var(--accent-dim); }
  .log .line:not(.done)::before { content: "… "; color: var(--fg-dim); }

  @keyframes fadein { to { opacity: 1; } }

  .error-box {
    margin-top: 18px;
    border: 1px solid #4a2f2c;
    background: #1c1414;
    color: var(--error);
    font-family: var(--mono);
    font-size: 13px;
    padding: 12px 14px;
    border-radius: 6px;
    display: none;
  }

  .output {
    margin-top: 32px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 32px 36px;
    display: none;
  }

  .output h1, .output h2, .output h3 {
    font-family: var(--mono);
    color: var(--fg);
  }
  .output h1 { font-size: 20px; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-top: 0; }
  .output h2 { font-size: 15px; color: var(--accent); margin-top: 30px; text-transform: uppercase; letter-spacing: 0.04em; }
  .output p, .output li { font-size: 14.5px; line-height: 1.65; color: #cfcdc5; }
  .output code {
    font-family: var(--mono);
    background: #0d1218;
    border: 1px solid var(--line);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 13px;
    color: var(--accent);
  }
  .output ol, .output ul { padding-left: 22px; }
  .output a { color: var(--accent); }

  footer {
    margin-top: 40px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: #4d5763;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">codebase-onboarder / mcp client</div>
      <h1>onboard<span class="cursor"></span></h1>
      <p class="sub">Paste a public GitHub repo URL. Claude pulls the file tree and README over MCP and writes you a real onboarding doc — where to start reading, key abstractions, gotchas.</p>
    </header>

    <form id="form">
      <div class="prompt-bar">
        <span class="prompt-sigil">&gt;</span>
        <input
          id="repoUrl"
          type="text"
          placeholder="https://github.com/owner/repo"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="run-btn" type="submit" id="runBtn">run</button>
      </div>
    </form>

    <div class="log" id="log"></div>
    <div class="error-box" id="errorBox"></div>
    <div class="output" id="output"></div>

    <footer>GET /api/onboard runs a Claude tool-use loop against a local MCP server over stdio.</footer>
  </div>

<script>
const form = document.getElementById('form');
const input = document.getElementById('repoUrl');
const runBtn = document.getElementById('runBtn');
const logEl = document.getElementById('log');
const errorBox = document.getElementById('errorBox');
const output = document.getElementById('output');

const TOOL_LABELS = {
  get_repo_structure: 'fetching repo file tree',
  get_readme: 'fetching readme',
  get_file: 'reading a file',
  get_open_issues: 'checking open issues',
  get_recent_commits: 'checking recent commits',
};

function resetUI() {
  logEl.innerHTML = '';
  errorBox.style.display = 'none';
  errorBox.textContent = '';
  output.style.display = 'none';
  output.innerHTML = '';
}

function addLogLine(text) {
  const prev = logEl.querySelector('.line:last-child:not(.done)');
  if (prev) prev.classList.add('done');
  const div = document.createElement('div');
  div.className = 'line';
  div.textContent = text;
  logEl.appendChild(div);
}

function finishLog() {
  const last = logEl.querySelector('.line:last-child');
  if (last) last.classList.add('done');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const repoUrl = input.value.trim();
  if (!repoUrl) return;

  resetUI();
  runBtn.disabled = true;
  addLogLine('connecting to mcp server');

  let docBuffer = '';
  let outputShown = false;

  try {
    const res = await fetch('/api/onboard', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ repo_url: repoUrl }),
    });

    if (!res.ok || !res.body) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.detail || `Request failed (${res.status})`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buf.indexOf('\n')) !== -1) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line) continue;

        let event;
        try { event = JSON.parse(line); } catch { continue; }

        switch (event.type) {
          case 'status':
            addLogLine(event.message);
            break;

          case 'tool_call':
            // A tool call means any text just streamed was pre-tool-call
            // chatter, not the final doc — discard it and go back to log view.
            if (outputShown) {
              output.style.display = 'none';
              output.innerHTML = '';
              docBuffer = '';
              outputShown = false;
            }
            addLogLine(TOOL_LABELS[event.name] || `calling ${event.name}`);
            break;

          case 'text_delta':
            docBuffer += event.text;
            if (!outputShown) {
              finishLog();
              output.style.display = 'block';
              outputShown = true;
            }
            output.innerHTML = marked.parse(docBuffer);
            break;

          case 'done':
            if (event.doc) docBuffer = event.doc;
            finishLog();
            output.innerHTML = marked.parse(docBuffer);
            output.style.display = 'block';
            break;

          case 'error':
            throw new Error(event.detail || 'Something went wrong.');
        }
      }
    }
  } catch (err) {
    finishLog();
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
  } finally {
    runBtn.disabled = false;
  }
});
</script>
</body>
</html>
